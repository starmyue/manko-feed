name: 每日更新 RSS 订阅

on:
  schedule:
    - cron: '7 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓取最新数据并生成 feed
        run: python3 refresh.py 3
      - name: 同步预览页
        run: cp preview.html index.html
      - name: 提交并推送
        run: |
          git config user.name "manko-feed-bot"
          git config user.email "manko-feed-bot@users.noreply.github.com"
          git add manko-feed.xml index.html items.json preview.html
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "自动更新: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
